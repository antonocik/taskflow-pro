<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow Pro — Manajemen Tugas</title>
  <meta name="description" content="TaskFlow Pro: aplikasi manajemen tugas dengan kategori, prioritas, tanggal jatuh tempo, filter, pencarian, dan penyimpanan LocalStorage.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Cpath d='M9 16l4 4 10-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-head">
      <div class="brand">
        <div class="brand__mark">TF</div>
        <div>
          <h1>TaskFlow Pro</h1>
          <p>Manajemen tugas dengan kategori, prioritas, dan jatuh tempo.</p>
        </div>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="stat__label">Total</div><div class="stat__value" id="statTotal">0</div></div>
      <div class="stat stat--done"><div class="stat__label">Selesai</div><div class="stat__value" id="statDone">0</div></div>
      <div class="stat stat--pending"><div class="stat__label">Tertunda</div><div class="stat__value" id="statPending">0</div></div>
    </div>

    <div class="card">
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-grid">
          <div class="field full">
            <label for="title">Judul tugas</label>
            <input id="title" type="text" placeholder="Contoh: Kirim laporan mingguan" required>
          </div>
          <div class="field">
            <label for="category">Kategori</label>
            <select id="category">
              <option value="work">Kerja</option>
              <option value="personal">Pribadi</option>
              <option value="shopping">Belanja</option>
              <option value="other">Lainnya</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Prioritas</label>
            <select id="priority">
              <option value="high">Tinggi</option>
              <option value="med" selected>Sedang</option>
              <option value="low">Rendah</option>
            </select>
          </div>
          <div class="field">
            <label for="due">Jatuh tempo</label>
            <input id="due" type="date">
          </div>
          <div class="field">
            <label for="notes">Catatan (opsional)</label>
            <input id="notes" type="text" placeholder="Detail tambahan">
          </div>
          <div class="field full" style="display:flex; gap:10px; justify-content:flex-end;">
            <button type="button" class="btn btn--ghost" id="cancelEdit">Batal</button>
            <button type="submit" class="btn btn--primary" id="submitBtn">Tambah tugas</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Cari tugas...">
        <select id="filterStatus">
          <option value="all">Semua status</option>
          <option value="active">Belum selesai</option>
          <option value="done">Selesai</option>
        </select>
        <select id="filterCategory">
          <option value="all">Semua kategori</option>
          <option value="work">Kerja</option>
          <option value="personal">Pribadi</option>
          <option value="shopping">Belanja</option>
          <option value="other">Lainnya</option>
        </select>
        <select id="filterPriority">
          <option value="all">Semua prioritas</option>
          <option value="high">Tinggi</option>
          <option value="med">Sedang</option>
          <option value="low">Rendah</option>
        </select>
      </div>
      <ul class="task-list" id="taskList"></ul>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px;">
        <button class="btn btn--ghost" id="clearDone">Hapus yang selesai</button>
        <button class="btn btn--danger" id="clearAll">Hapus semua</button>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
